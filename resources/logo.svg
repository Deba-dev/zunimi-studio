<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Zunimi Studio: the ZunimiLabs Z (cyan > blue > violet) on a graphite tile, with a red live dot. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141A2C"/>
      <stop offset="1" stop-color="#0A0D16"/>
    </linearGradient>
    <linearGradient id="z" x1="0.18" y1="0.12" x2="0.42" y2="0.98">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#3B5BFF"/>
      <stop offset="1" stop-color="#8B3DFF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="3"/>
  <ellipse cx="128" cy="130" rx="100" ry="40" fill="none" stroke="url(#ring)" stroke-width="7"
           stroke-linecap="round" stroke-dasharray="190 70 150 1000" transform="rotate(-28 128 130)"/>
  <path d="M58 94 L71 64 H198 L114 164 H200 L187 194 H58 L142 94 Z" fill="url(#z)"/>
  <circle cx="204" cy="54" r="21" fill="#0A0D16"/>
  <circle cx="204" cy="54" r="15" fill="#FF3B5C"/>
</svg>
